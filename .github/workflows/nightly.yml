name: Nightly Integration Tests

"on":
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

env:
  DAPR_CLI_VERSION: '1.18.0'
  DAPR_RUNTIME_VERSION: '1.18.1'
  MEMORIES_DAPR_PLACEMENT_HOST_ADDRESS: '127.0.0.1:50005'
  MEMORIES_DAPR_SCHEDULER_HOST_ADDRESS: '127.0.0.1:50006'

jobs:
  integration-fast:
    name: Tier 3 integration (fast lane)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Initialize build submodules
        uses: Hexalith/Hexalith.Builds/Github/initialize-build@main

      - name: Initialize .NET
        uses: Hexalith/Hexalith.Builds/Github/initialize-dotnet@main
        with:
          global-json-file: global.json

      - name: Install Dapr CLI
        uses: dapr/setup-dapr@v2
        with:
          version: ${{ env.DAPR_CLI_VERSION }}

      - name: Initialize Dapr runtime
        run: |
          dapr init --slim --runtime-version ${{ env.DAPR_RUNTIME_VERSION }}
          docker run -d --name dapr_placement -p 50005:50005 daprio/dapr:${{ env.DAPR_RUNTIME_VERSION }} ./placement
          docker volume create dapr_scheduler
          docker run -d --name dapr_scheduler -p 50006:50006 -p 2379:2379 -v dapr_scheduler:/var/lock daprio/dapr:${{ env.DAPR_RUNTIME_VERSION }} ./scheduler --etcd-data-dir=/var/lock/dapr/scheduler --override-broadcast-host-port=127.0.0.1:50006 --etcd-client-listen-address=0.0.0.0
          dapr --version

      - name: Provision ephemeral EventStore local NuGet feed
        # Story 28.1 (sprint-change-approved "Option B"): HexalithEventStoreVersion is pinned to
        # a proof-identity version (999.1.20-proof.fa2d1c9910f8) not published on nuget.org.
        # Restoring it requires a local feed rebuilt from the approved source SHA and signed with
        # a certificate, but that certificate/key/prebuilt .nupkg must NEVER be persisted in the
        # repo, in CI caches, or in CI secrets -- this step generates everything fresh in this
        # job's own $RUNNER_TEMP and the job discards it on exit. See
        # tools/ci/provision-eventstore-local-feed.sh and
        # spec-28-1-adopt-owner-approved-eventstore-runtime-identity.md. Required here because the
        # integration-slow lane is what runs this story's own Category=IntegrationSlow proof test.
        run: tools/ci/provision-eventstore-local-feed.sh fa2d1c9910f8976553adb33dcdb1c9ff2ea75594 999.1.20-proof.fa2d1c9910f8

      - name: Restore solution
        # Directory.Build.props keeps NU1901-1904 non-fatal (Hexalith ci-cd-standards.md,
        # "Dependency Auditing"), but that only reaches this repo's own projects. Repeat it here
        # via -p: so the same restore graph's Hexalith.FrontComposer submodule project (a separate
        # Directory.Build.props chain) isn't fatally blocked by the AngleSharp/bunit NU1902 chain.
        run: dotnet restore Hexalith.Memories.slnx -p:Configuration=Release -p:WarningsNotAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904 --configfile "$EVENTSTORE_LOCAL_NUGET_CONFIG"

      - name: Run Tier 3 integration tests (fast lane, excludes IntegrationSlow and Performance)
        run: bash ./tools/test.sh --filter "Category=Integration&Category!=IntegrationSlow&Category!=Performance" --configuration Release

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-integration-fast-artifacts
          path: |
            **/TestResults/**
            artifacts/**
          if-no-files-found: ignore

  integration-slow:
    name: Tier 3 integration (slow lane)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Initialize build submodules
        uses: Hexalith/Hexalith.Builds/Github/initialize-build@main

      - name: Initialize .NET
        uses: Hexalith/Hexalith.Builds/Github/initialize-dotnet@main
        with:
          global-json-file: global.json

      - name: Install Dapr CLI
        uses: dapr/setup-dapr@v2
        with:
          version: ${{ env.DAPR_CLI_VERSION }}

      - name: Initialize Dapr runtime
        run: |
          dapr init --slim --runtime-version ${{ env.DAPR_RUNTIME_VERSION }}
          docker run -d --name dapr_placement -p 50005:50005 daprio/dapr:${{ env.DAPR_RUNTIME_VERSION }} ./placement
          docker volume create dapr_scheduler
          docker run -d --name dapr_scheduler -p 50006:50006 -p 2379:2379 -v dapr_scheduler:/var/lock daprio/dapr:${{ env.DAPR_RUNTIME_VERSION }} ./scheduler --etcd-data-dir=/var/lock/dapr/scheduler --override-broadcast-host-port=127.0.0.1:50006 --etcd-client-listen-address=0.0.0.0
          dapr --version

      - name: Provision ephemeral EventStore local NuGet feed
        # Story 28.1 (sprint-change-approved "Option B"): HexalithEventStoreVersion is pinned to
        # a proof-identity version (999.1.20-proof.fa2d1c9910f8) not published on nuget.org.
        # Restoring it requires a local feed rebuilt from the approved source SHA and signed with
        # a certificate, but that certificate/key/prebuilt .nupkg must NEVER be persisted in the
        # repo, in CI caches, or in CI secrets -- this step generates everything fresh in this
        # job's own $RUNNER_TEMP and the job discards it on exit. See
        # tools/ci/provision-eventstore-local-feed.sh and
        # spec-28-1-adopt-owner-approved-eventstore-runtime-identity.md. Required here because the
        # integration-slow lane is what runs this story's own Category=IntegrationSlow proof test.
        run: tools/ci/provision-eventstore-local-feed.sh fa2d1c9910f8976553adb33dcdb1c9ff2ea75594 999.1.20-proof.fa2d1c9910f8

      - name: Restore solution
        # Directory.Build.props keeps NU1901-1904 non-fatal (Hexalith ci-cd-standards.md,
        # "Dependency Auditing"), but that only reaches this repo's own projects. Repeat it here
        # via -p: so the same restore graph's Hexalith.FrontComposer submodule project (a separate
        # Directory.Build.props chain) isn't fatally blocked by the AngleSharp/bunit NU1902 chain.
        run: dotnet restore Hexalith.Memories.slnx -p:Configuration=Release -p:WarningsNotAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904 --configfile "$EVENTSTORE_LOCAL_NUGET_CONFIG"

      - name: Run Tier 3 integration tests (slow lane only)
        run: bash ./tools/test.sh --filter "Category=IntegrationSlow" --configuration Release

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-integration-slow-artifacts
          path: |
            **/TestResults/**
            artifacts/**
          if-no-files-found: ignore

  benchmark:
    name: NDCG benchmark quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Initialize build submodules
        uses: Hexalith/Hexalith.Builds/Github/initialize-build@main

      - name: Initialize .NET
        uses: Hexalith/Hexalith.Builds/Github/initialize-dotnet@main
        with:
          global-json-file: global.json

      - name: Verify Docker
        run: docker info

      - name: Provision ephemeral EventStore local NuGet feed
        # Story 28.1 (sprint-change-approved "Option B"): HexalithEventStoreVersion is pinned to
        # a proof-identity version (999.1.20-proof.fa2d1c9910f8) not published on nuget.org.
        # Restoring it requires a local feed rebuilt from the approved source SHA and signed with
        # a certificate, but that certificate/key/prebuilt .nupkg must NEVER be persisted in the
        # repo, in CI caches, or in CI secrets -- this step generates everything fresh in this
        # job's own $RUNNER_TEMP and the job discards it on exit. See
        # tools/ci/provision-eventstore-local-feed.sh and
        # spec-28-1-adopt-owner-approved-eventstore-runtime-identity.md. Required here because the
        # integration-slow lane is what runs this story's own Category=IntegrationSlow proof test.
        run: tools/ci/provision-eventstore-local-feed.sh fa2d1c9910f8976553adb33dcdb1c9ff2ea75594 999.1.20-proof.fa2d1c9910f8

      - name: Restore solution
        # Directory.Build.props keeps NU1901-1904 non-fatal (Hexalith ci-cd-standards.md,
        # "Dependency Auditing"), but that only reaches this repo's own projects. Repeat it here
        # via -p: so the same restore graph's Hexalith.FrontComposer submodule project (a separate
        # Directory.Build.props chain) isn't fatally blocked by the AngleSharp/bunit NU1902 chain.
        run: dotnet restore Hexalith.Memories.slnx -p:Configuration=Release -p:WarningsNotAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904 --configfile "$EVENTSTORE_LOCAL_NUGET_CONFIG"

      - name: Build solution
        run: dotnet build Hexalith.Memories.slnx --configuration Release --no-restore

      - name: Run complete NDCG benchmark project
        run: bash ./tools/test.sh --filter "Category=Benchmark" --configuration Release --no-build --results-directory TestResults/benchmark

      - name: Upload benchmark TRX
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-benchmark-trx
          path: TestResults/benchmark/Hexalith.Memories.Benchmarks/Hexalith.Memories.Benchmarks.trx
          if-no-files-found: error
          retention-days: 14

      - name: Upload benchmark quality result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-benchmark-quality-result
          path: tests/Hexalith.Memories.Benchmarks/bin/Release/net10.0/benchmark-results.json
          if-no-files-found: error
          retention-days: 14
