# Production deployment template.
# Local development uses AppHost-generated component YAML under the temp directory.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: "redis:6379"
    - name: redisPassword
      value: "${STATESTORE_REDIS_PASSWORD:-}"
    - name: actorStateStore
      value: "true"
