# Applied after each Helm install/upgrade to pin the server ServiceAccount's automount
# default to false.
#
# Story 31.1 measured what this actually achieves on the deployed platform: the running
# pods set `automountServiceAccountToken: true` in their own pod spec, and the pod-level
# setting wins over the ServiceAccount default. The server therefore DOES receive and use
# a Kubernetes API token -- it needs one for `service_registration "kubernetes"`, backed by
# Role `hexalith-keys-discovery-role`. What this file still does is deny an automounted
# token to any other pod that runs as this ServiceAccount without asking for one itself.
# Do not read this file as evidence that the server holds no API token.
#
# See docs/operations/openbao.md, section "deploy/openbao/service-account-hardening.yaml".
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hexalith-keys
  namespace: openbao
automountServiceAccountToken: false
