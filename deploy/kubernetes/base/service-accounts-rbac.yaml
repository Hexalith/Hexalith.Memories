apiVersion: v1
kind: ServiceAccount
metadata:
  name: memories
imagePullSecrets:
  - name: registry-credentials
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: memories-mcp
imagePullSecrets:
  - name: registry-credentials
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eventstore
imagePullSecrets:
  - name: registry-credentials
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: memories-dapr-secret-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - app-api-token
      - dapr-api-token
      - redis-secret
      - llm-secret
      - google-embedding-api-key
      - memories-embedding-client-secret
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: memories-dapr-secret-reader
subjects:
  - kind: ServiceAccount
    name: memories
    namespace: hexalith-memories
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: memories-dapr-secret-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: memories-mcp-token-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["app-api-token", "dapr-api-token"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: memories-mcp-token-reader
subjects:
  - kind: ServiceAccount
    name: memories-mcp
    namespace: hexalith-memories
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: memories-mcp-token-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eventstore-dapr-secret-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["app-api-token", "dapr-api-token", "redis-secret"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eventstore-dapr-secret-reader
subjects:
  - kind: ServiceAccount
    name: eventstore
    namespace: hexalith-memories
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eventstore-dapr-secret-reader
