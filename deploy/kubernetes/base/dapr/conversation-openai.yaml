apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: llm-openai
spec:
  type: conversation.openai
  version: v1
  metadata:
    - name: key
      secretKeyRef:
        name: llm-secret
        key: OPENAI_API_KEY
    - name: model
      value: gpt-4o-mini
    - name: responseCacheTTL
      value: 0s
auth:
  secretStore: secretstore
scopes:
  - memories
