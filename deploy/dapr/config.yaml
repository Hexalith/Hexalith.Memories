# Self-hosted DAPR configuration used by the Aspire AppHost. Invocation ACLs require mTLS caller
# identities, while local self-hosted DAPR intentionally runs without mTLS. Kubernetes uses the
# separate deny-by-default configuration under deploy/kubernetes/base/dapr/config.yaml.
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: memories-config
spec:
  secrets:
    scopes:
      - storeName: secretstore
        defaultAccess: deny
        allowedSecrets:
          - redis-secret
          - google-embedding-api-key
          - memories-embedding-client-secret
          - llm-secret
