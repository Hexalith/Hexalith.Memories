name: Nightly Integration Tests

"on":
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

env:
  DAPR_CLI_VERSION: '1.18.0'
  DAPR_RUNTIME_VERSION: '1.18.1'
  MEMORIES_DAPR_PLACEMENT_HOST_ADDRESS: '127.0.0.1:50005'
  MEMORIES_DAPR_SCHEDULER_HOST_ADDRESS: '127.0.0.1:50006'

jobs:
  integration-fast:
    name: Tier 3 integration (fast lane)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize build submodules
        uses: Hexalith/Hexalith.Builds/Github/initialize-build@main

      - name: Initialize .NET
        uses: Hexalith/Hexalith.Builds/Github/initialize-dotnet@main
        with:
          global-json-file: global.json

      - name: Install Dapr CLI
        shell: bash
        run: |
          set -euo pipefail
          installer="${RUNNER_TEMP}/install-dapr-cli.sh"
          curl -fsSL "https://raw.githubusercontent.com/dapr/cli/v${DAPR_CLI_VERSION}/install/install.sh" -o "$installer"
          /bin/bash "$installer" "$DAPR_CLI_VERSION"

      - name: Initialize Dapr runtime
        run: |
          dapr init --slim --runtime-version ${{ env.DAPR_RUNTIME_VERSION }}
          docker run -d --name dapr_placement -p 50005:50005 daprio/dapr:${{ env.DAPR_RUNTIME_VERSION }} ./placement
          docker volume create dapr_scheduler
          docker run -d --name dapr_scheduler -p 50006:50006 -p 2379:2379 -v dapr_scheduler:/var/lock daprio/dapr:${{ env.DAPR_RUNTIME_VERSION }} ./scheduler --etcd-data-dir=/var/lock/dapr/scheduler --override-broadcast-host-port=127.0.0.1:50006 --etcd-client-listen-address=0.0.0.0
          dapr --version

      - name: Restore solution
        run: dotnet restore Hexalith.Memories.slnx -p:Configuration=Release

      - name: Run Tier 3 integration tests (fast lane, excludes IntegrationSlow and Performance)
        run: bash ./tools/test.sh --filter "Category=Integration&Category!=IntegrationSlow&Category!=Performance" --configuration Release

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-integration-fast-artifacts
          path: |
            **/TestResults/**
            artifacts/**
          if-no-files-found: ignore

  integration-slow:
    name: Tier 3 integration (slow lane)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize build submodules
        uses: Hexalith/Hexalith.Builds/Github/initialize-build@main

      - name: Initialize .NET
        uses: Hexalith/Hexalith.Builds/Github/initialize-dotnet@main
        with:
          global-json-file: global.json

      - name: Install Dapr CLI
        shell: bash
        run: |
          set -euo pipefail
          installer="${RUNNER_TEMP}/install-dapr-cli.sh"
          curl -fsSL "https://raw.githubusercontent.com/dapr/cli/v${DAPR_CLI_VERSION}/install/install.sh" -o "$installer"
          /bin/bash "$installer" "$DAPR_CLI_VERSION"

      - name: Initialize Dapr runtime
        run: |
          dapr init --slim --runtime-version ${{ env.DAPR_RUNTIME_VERSION }}
          docker run -d --name dapr_placement -p 50005:50005 daprio/dapr:${{ env.DAPR_RUNTIME_VERSION }} ./placement
          docker volume create dapr_scheduler
          docker run -d --name dapr_scheduler -p 50006:50006 -p 2379:2379 -v dapr_scheduler:/var/lock daprio/dapr:${{ env.DAPR_RUNTIME_VERSION }} ./scheduler --etcd-data-dir=/var/lock/dapr/scheduler --override-broadcast-host-port=127.0.0.1:50006 --etcd-client-listen-address=0.0.0.0
          dapr --version

      - name: Restore solution
        run: dotnet restore Hexalith.Memories.slnx -p:Configuration=Release

      - name: Run Tier 3 integration tests (slow lane only)
        run: bash ./tools/test.sh --filter "Category=IntegrationSlow" --configuration Release

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-integration-slow-artifacts
          path: |
            **/TestResults/**
            artifacts/**
          if-no-files-found: ignore
