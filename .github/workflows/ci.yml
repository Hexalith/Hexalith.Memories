name: CI

"on":
  pull_request:
    branches:
      - main
  push:

permissions:
  contents: read

env:
  DAPR_CLI_VERSION: '1.18.0'
  DAPR_RUNTIME_VERSION: '1.18.1'
  MEMORIES_DAPR_PLACEMENT_HOST_ADDRESS: '127.0.0.1:50005'
  MEMORIES_DAPR_SCHEDULER_HOST_ADDRESS: '127.0.0.1:50006'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  story-file-scope:
    name: story-file-scope
    if: ${{ github.event_name != 'push' || github.ref_name != 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: false

      - name: Collect story scope inputs
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p .story-scope

          fail() {
            echo "::error::story-file-scope: $1"
            exit 1
          }

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            branch_name="$PR_HEAD_REF"
            head_sha="$PR_HEAD_SHA"
            base_sha="$PR_BASE_SHA"

            if [[ -z "$branch_name" ]]; then
              fail "github.head_ref is empty for pull_request event; cannot derive branch metadata"
            fi
            if [[ -z "$head_sha" ]]; then
              fail "github.event.pull_request.head.sha is empty; cannot validate PR head"
            fi
            if [[ -z "$base_sha" ]]; then
              fail "github.event.pull_request.base.sha is empty; cannot establish PR diff base"
            fi

            if ! git diff --name-only "$base_sha" "$head_sha" -- > .story-scope/changed-files.txt; then
              fail "'git diff --name-only $base_sha $head_sha' failed; cannot establish PR diff"
            fi
          else
            branch_name="${GITHUB_REF_NAME:-}"
            head_sha="${GITHUB_SHA:-}"

            if [[ -z "$branch_name" ]]; then
              fail "GITHUB_REF_NAME is empty for $EVENT_NAME event; cannot derive branch metadata"
            fi
            if [[ -z "$head_sha" ]]; then
              fail "GITHUB_SHA is empty for $EVENT_NAME event; cannot resolve HEAD"
            fi

            use_main_base=0
            if [[ "$branch_name" == "main" ]]; then
              use_main_base=1
            elif [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
              use_main_base=1
            elif ! git rev-parse --verify --quiet "$PUSH_BEFORE_SHA^{commit}" >/dev/null; then
              # Force-push or otherwise unreachable previous commit: fall back to
              # diffing against origin/main rather than swallowing the failure
              # and degrading to "every file in HEAD".
              use_main_base=1
            fi

            if [[ "$use_main_base" == "1" ]]; then
              # Checkout with fetch-depth: 0 already pulled full
              # history; refresh main without `|| true` so auth/network/repo-rename
              # failures are loud and named (12.4-RV1).
              if ! git fetch --no-tags --prune origin main; then
                fail "'git fetch --no-tags --prune origin main' failed; cannot establish base for diff against origin/main"
              fi
              if ! git rev-parse --verify --quiet origin/main >/dev/null; then
                fail "'git rev-parse origin/main' did not resolve after fetch; cannot establish diff base"
              fi

              base_sha="$(git rev-parse origin/main)"

              if [[ "$base_sha" == "$head_sha" ]]; then
                # Direct push to main, fully-rebased branch with no new commits,
                # or new branch at exactly origin/main HEAD: diff would be empty
                # and would silently pass file-scope validation (12.4-RV3).
                fail "HEAD ($head_sha) equals origin/main; refusing to validate empty diff (direct-push, fully-rebased, or branch at origin/main)"
              fi

              # 2-dot semantics avoid the shallow merge-base reachability that
              # `A...B` requires (12.4-RV2). The local clone has full history.
              if ! git diff --name-only "$base_sha" "$head_sha" -- > .story-scope/changed-files.txt; then
                fail "'git diff --name-only $base_sha $head_sha' failed when diffing branch against origin/main"
              fi
            else
              if ! git diff --name-only "$PUSH_BEFORE_SHA" "$head_sha" -- > .story-scope/changed-files.txt; then
                fail "'git diff --name-only $PUSH_BEFORE_SHA $head_sha' failed when diffing push range"
              fi
            fi
          fi

          if [[ ! -s .story-scope/changed-files.txt ]]; then
            # CI must fail on empty diff because the validator's local CLI
            # no-op-success path is intentional for hooks/manual runs and is
            # the historical bypass under review (AC #2).
            fail "changed-files list is empty for $EVENT_NAME event; refusing to silently pass file-scope validation"
          fi

          if ! git log -1 --format=%B "$head_sha" > .story-scope/commit-message.txt; then
            fail "'git log -1 --format=%B $head_sha' failed; cannot read commit message for trailer parsing"
          fi

          # Randomized heredoc sentinel so a hostile branch name cannot collide
          # with the closer (12.4-RV4). $RANDOM is shell-internal; combine with
          # nanoseconds and PID for a delimiter no caller can predict.
          delim="STORY_SCOPE_EOF_$(date +%s%N)_$$_${RANDOM}_${RANDOM}"
          {
            printf 'BRANCH_NAME<<%s\n%s\n%s\n' "$delim" "$branch_name" "$delim"
            echo "COMMIT_MESSAGE_FILE=.story-scope/commit-message.txt"
            echo "CHANGED_FILES_FILE=.story-scope/changed-files.txt"
          } >> "$GITHUB_ENV"

      - name: Validate story file scope
        run: python3 tools/check-story-file-scope.py --branch-name "$BRANCH_NAME" --commit-message-file "$COMMIT_MESSAGE_FILE" --changed-files-file "$CHANGED_FILES_FILE"

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: false

      - name: Initialize build submodules
        uses: Hexalith/Hexalith.Builds/Github/initialize-build@main

      - name: Initialize .NET
        uses: Hexalith/Hexalith.Builds/Github/initialize-dotnet@main
        with:
          global-json-file: global.json

      - name: Restore solution
        run: dotnet restore Hexalith.Memories.slnx -p:Configuration=Release

      - name: Build solution
        run: dotnet build Hexalith.Memories.slnx --configuration Release --no-restore

  test-unit-contract:
    name: test-unit-contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: false

      - name: Initialize build submodules
        uses: Hexalith/Hexalith.Builds/Github/initialize-build@main

      - name: Initialize .NET
        uses: Hexalith/Hexalith.Builds/Github/initialize-dotnet@main
        with:
          global-json-file: global.json

      - name: Restore solution
        run: dotnet restore Hexalith.Memories.slnx -p:Configuration=Release

      - name: Build solution
        run: dotnet build Hexalith.Memories.slnx --configuration Release --no-restore

      - name: Run Docker-free unit and contract tests
        run: bash ./tools/test.sh --filter "Category!=Integration" --configuration Release --no-build --results-directory TestResults/test-unit-contract

      - name: Upload unit and contract test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-unit-contract-results
          path: TestResults/test-unit-contract/**
          if-no-files-found: error
          retention-days: 14

  integration-fast:
    name: integration-fast
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: false

      - name: Initialize build submodules
        uses: Hexalith/Hexalith.Builds/Github/initialize-build@main

      - name: Initialize .NET
        uses: Hexalith/Hexalith.Builds/Github/initialize-dotnet@main
        with:
          global-json-file: global.json

      - name: Install Dapr CLI
        uses: dapr/setup-dapr@8d980918fd43a2765c143ce7f687665b2d46a6b9 # v2
        with:
          version: ${{ env.DAPR_CLI_VERSION }}

      - name: Initialize Dapr runtime
        run: |
          dapr init --slim --runtime-version ${{ env.DAPR_RUNTIME_VERSION }}
          docker run -d --name dapr_placement -p 50005:50005 daprio/dapr:${{ env.DAPR_RUNTIME_VERSION }} ./placement
          docker volume create dapr_scheduler
          docker run -d --name dapr_scheduler -p 50006:50006 -p 2379:2379 -v dapr_scheduler:/var/lock daprio/dapr:${{ env.DAPR_RUNTIME_VERSION }} ./scheduler --etcd-data-dir=/var/lock/dapr/scheduler --override-broadcast-host-port=127.0.0.1:50006 --etcd-client-listen-address=0.0.0.0
          dapr --version

      - name: Verify Docker availability
        run: |
          docker version
          docker info

      - name: Restore solution
        run: dotnet restore Hexalith.Memories.slnx -p:Configuration=Release

      - name: Build solution
        run: dotnet build Hexalith.Memories.slnx --configuration Release --no-restore

      - name: Run fast Docker-backed integration tests
        run: bash ./tools/test.sh --filter "Category=Integration&Category!=IntegrationSlow&Category!=Performance" --configuration Release --no-build --results-directory TestResults/integration-fast

      - name: Verify fast integration coverage evidence
        run: python3 tools/verify-integration-fast-coverage.py --results-directory TestResults/integration-fast

      - name: Upload fast integration test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-fast-results
          path: TestResults/integration-fast/**
          if-no-files-found: error
          retention-days: 14
