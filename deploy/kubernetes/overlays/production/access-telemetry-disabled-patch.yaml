# Both Deployments below are scaled to 0: no published container image exists yet for either
# service (Story 27.3 pending), so leaving them at their base replica count would schedule
# unschedulable/unpullable pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memories-access-telemetry
  annotations:
    memories.hexalith.io/access-telemetry-status: disabled-pending-story-27-3
    memories.hexalith.io/required-component-profile: exact-version-and-behavioral-evidence
    memories.hexalith.io/required-dapr-configuration: access-telemetry-config/retentionSeconds
spec:
  replicas: 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memories-access-telemetry-clock
  annotations:
    memories.hexalith.io/access-telemetry-status: disabled-pending-story-27-3
    memories.hexalith.io/required-component-profile: exact-version-and-behavioral-evidence
    memories.hexalith.io/required-dapr-configuration: access-telemetry-clock-config/timeAttestation
spec:
  replicas: 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memories
  annotations:
    memories.hexalith.io/access-telemetry-provider: disabled-pending-story-27-3
