# Portable template only. Story 27.3 must select, pin, and prove the exact Production adapter.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: access-telemetry-store
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: redis:6379
    - name: redisPassword
      secretKeyRef:
        name: redis-secret
        key: password
    - name: actorStateStore
      value: "true"
    - name: queryIndexes
      value: |
        [{"name":"expiryMinute","type":"NUMERIC"}]
auth:
  secretStore: access-telemetry-secrets
scopes:
  - memories-access-telemetry
