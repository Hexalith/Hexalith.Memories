apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secretstore
spec:
  type: secretstores.hashicorp.vault
  version: v1
  metadata:
    - name: vaultAddr
      value: https://hexalith-keys.openbao.svc.cluster.local:8200
    - name: caPem
      secretKeyRef:
        name: openbao-runtime-bootstrap
        key: ca.pem
    - name: skipVerify
      value: "false"
    - name: tlsServerName
      value: hexalith-keys.openbao.svc.cluster.local
    - name: vaultToken
      secretKeyRef:
        name: openbao-runtime-bootstrap
        key: token
    - name: vaultKVPrefix
      value: hexalith/memories/runtime
    - name: vaultKVUsePrefix
      value: "true"
    - name: enginePath
      value: secret
    - name: vaultValueType
      value: map
scopes:
  - eventstore
  - memories
