apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: access-telemetry-secrets
spec:
  type: secretstores.hashicorp.vault
  version: v1
  metadata:
    - name: vaultAddr
      value: https://hexalith-keys.openbao.svc.cluster.local:8200
    - name: caPem
      secretKeyRef:
        name: openbao-access-telemetry-bootstrap
        key: ca.pem
    - name: skipVerify
      value: "false"
    - name: tlsServerName
      value: hexalith-keys.openbao.svc.cluster.local
    - name: vaultToken
      secretKeyRef:
        name: openbao-access-telemetry-bootstrap
        key: token
    - name: vaultKVPrefix
      value: hexalith/memories/access-telemetry
    - name: vaultKVUsePrefix
      value: "true"
    - name: enginePath
      value: secret
    - name: vaultValueType
      value: map
scopes:
  - memories
  - memories-access-telemetry
  - memories-access-telemetry-clock
