# PG-ONPREM-1 qualification template. Production writes remain disabled until Story 27.3 passes C1.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: access-telemetry-store
spec:
  type: state.postgresql
  version: v2
  initTimeout: 1m
  metadata:
    - name: connectionString
      secretKeyRef:
        name: access-telemetry-postgresql
        key: connectionString
    - name: tablePrefix
      value: access_telemetry.lifecycle_
    - name: metadataTableName
      value: access_telemetry.dapr_metadata
    - name: timeout
      value: 3s
    - name: cleanupInterval
      value: 5m
    # Story 27.3 C1 pool math: the ADR two-writer probe runs 2 lifecycle replicas, and each sidecar
    # opens its own pool. 2 x 40 = 80, plus PostgreSQL's 3 superuser-reserved connections and 10
    # evidence/sampling sessions, fits max_connections=100 with margin. Raising this without raising
    # max_connections in access-telemetry-postgresql.yaml exhausts the server during the 500 events/s
    # run; ProductionDeploymentArtifactsTests guards the invariant.
    - name: maxConns
      value: "40"
    - name: connectionMaxIdleTime
      value: 5m
    - name: actorStateStore
      value: "true"
auth:
  secretStore: access-telemetry-secrets
scopes:
  - memories-access-telemetry
