apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: memories-config
spec:
  secrets:
    scopes:
      - storeName: secretstore
        defaultAccess: deny
        allowedSecrets:
          - redis-secret
          - google-embedding-api-key
          - memories-embedding-client-secret
          - llm-secret
      - storeName: access-telemetry-secrets
        defaultAccess: deny
        allowedSecrets:
          - access-telemetry-marker-key
  accessControl:
    defaultAction: deny
    trustDomain: public
    policies:
      - appId: memories-mcp
        namespace: hexalith-memories
        trustDomain: public
        defaultAction: deny
        operations:
          - name: /api/v1/**
            httpVerb: ["GET", "POST"]
            action: allow
