apiVersion: builtin
kind: PatchTransformer
metadata:
  name: qualification-dapr-role-namespace
patch: |-
  - op: replace
    path: /metadata/namespace
    value: dapr-system
target:
  group: rbac.authorization.k8s.io
  version: v1
  kind: Role
  name: access-telemetry-qualification-dapr-control-plane
