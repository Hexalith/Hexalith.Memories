# Redis persistence configuration for Story 6.4
#
# Intent:
# - Enable append-only durability with the Redis-recommended every-second fsync policy.
# - Keep snapshotting enabled so restarts can use the faster RDB preamble path.
# - Store all persistence artifacts under the mounted /data volume.

appendonly yes
appendfsync everysec
dir /data
aof-use-rdb-preamble yes

# Keep Redis snapshotting enabled (official default profile).
save 900 1
save 300 10
save 60 10000
