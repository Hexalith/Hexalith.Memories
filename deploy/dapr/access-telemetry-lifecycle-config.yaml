# Workload-specific invocation policy. Self-hosted development does not claim ACL enforcement because
# Dapr service-invocation identities require mTLS; Kubernetes applies the equivalent policy below.
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: memories-access-telemetry-config
spec:
  secrets:
    scopes:
      - storeName: access-telemetry-secrets
        defaultAccess: deny
        allowedSecrets:
          - access-telemetry-marker-key
  accessControl:
    defaultAction: deny
    trustDomain: public
    policies:
      - appId: memories
        defaultAction: deny
        operations:
          - name: /v1/access-telemetry/write
            httpVerb: ["POST"]
            action: allow
          - name: /v1/access-telemetry/heartbeat
            httpVerb: ["POST"]
            action: allow
      - appId: memories-access-telemetry-inspector
        defaultAction: deny
        operations:
          - name: /v1/access-telemetry/inspect
            httpVerb: ["GET"]
            action: allow
