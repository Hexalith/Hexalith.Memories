name: Release

on:
  workflow_dispatch:

# cancel-in-progress: false is deliberate. A release run that is interrupted mid-publish
# would leave NuGet in a partial-publish state. The trusted Recover Partial Release workflow
# reconciles only historical nine-package tags; a current ten-package partial publish has no
# completion path until Story 30.5 (see docs/dev/release-runbook.md). An in-flight release must
# therefore run to completion rather than being cancelled by a later dispatch.
concurrency:
  group: release
  cancel-in-progress: false

env:
  KUBECTL_VERSION: 'v1.35.0'

# Least-privilege scopes for the release job:
# - actions: read - prove successful push CI for the exact current source.
# - contents: write - semantic-release creates the release tag and GitHub Release.
# - issues: write - Alert partial release publish step opens / comments on the
#   PARTIAL PUBLISH reconciliation issue.
# - pull-requests: write - @semantic-release/github comments on the PR that triggered
#   the release.
# - id-token: write - NuGet Trusted Publishing exchanges this job's OIDC token for a
#   one-hour publication key. No stored NuGet API key is used.
permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  release-source:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout dispatched source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false

      - name: Checkout approved Builds source proof
        uses: actions/checkout@v7
        with:
          repository: Hexalith/Hexalith.Builds
          ref: 6ad5854aa14a9950e1fbfc32d7e27953a1c4b82b
          path: .hexalith/builds-execution
          persist-credentials: false
          submodules: false

      - name: Prove current main and exact push CI before approval
        run: python3 tools/check-release-source.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Require production environment approval rule
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/environments/production" --jq '(.protection_rules | any(.[]; .type == "required_reviewers" and (.reviewers | length > 0))) and .can_admins_bypass == false and .deployment_branch_policy != null' | grep -qx true

  release:
    needs: release-source
    runs-on: ubuntu-latest
    # Ten packages and five multi-platform images must finish as one publication unit.
    timeout-minutes: 120
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - name: Initialize kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}

      # SDK 11 compiles net10.0; SDK 10 supplies its runtime and reference packs.
      - name: Install .NET 10 runtime and targeting packs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Prepare guarded release from pinned Builds
        id: prepare
        uses: Hexalith/Hexalith.Builds/Github/prepare-domain-release@6ad5854aa14a9950e1fbfc32d7e27953a1c4b82b
        with:
          solution: Hexalith.Memories.slnx
          builds-execution-sha: 6ad5854aa14a9950e1fbfc32d7e27953a1c4b82b
          expected-package-count: '10'
          package-manifest: tools/release-packages.json
          source-ci-workflow: ci.yml
          publication-flag: ${{ vars.HEXALITH_RELEASE_PUBLISH_ENABLED }}
          nuget-user: ${{ vars.NUGET_USER }}

      - name: Verify semantic-release configuration offline
        if: steps.prepare.outputs.publish-enabled == 'true'
        run: npm run verify:semantic-release-config

      - name: Validate package inventory before release
        if: steps.prepare.outputs.publish-enabled == 'true'
        shell: pwsh
        run: ./tools/validate-release-packages.ps1

      - name: Initialize both container platforms
        if: steps.prepare.outputs.publish-enabled == 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Require archive transport and isolated health tools
        if: steps.prepare.outputs.publish-enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null || { sudo apt-get update && sudo apt-get install -y skopeo; }
          command -v docker
          command -v openssl
          command -v curl
          docker buildx inspect --bootstrap

      - name: Run release preflight
        id: release-preflight
        if: steps.prepare.outputs.publish-enabled == 'true'
        shell: pwsh
        run: ./tools/release-preflight.ps1 -CheckDestinations
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEXALITH_ZOT_REGISTRY: ${{ vars.HEXALITH_ZOT_REGISTRY || 'registry.hexalith.com' }}
          HEXALITH_ZOT_USERNAME: ${{ secrets.HEXALITH_ZOT_USERNAME }}
          HEXALITH_ZOT_API_KEY: ${{ secrets.HEXALITH_ZOT_API_KEY }}

      - name: Snapshot release tags
        id: release-tags-before
        if: steps.prepare.outputs.publish-enabled == 'true'
        shell: bash
        run: git tag --points-at HEAD --list 'v*' | sort | sha256sum | sed 's/ .*//' | xargs -I{} echo 'fingerprint={}' >> "$GITHUB_OUTPUT"

      - name: Reprove current main and exact push CI before publication
        if: steps.prepare.outputs.publish-enabled == 'true' && steps.release-preflight.outputs.next-version != ''
        run: python3 tools/check-release-source.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Recheck production approval rule before publication
        if: steps.prepare.outputs.publish-enabled == 'true' && steps.release-preflight.outputs.next-version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/environments/production" --jq '(.protection_rules | any(.[]; .type == "required_reviewers" and (.reviewers | length > 0))) and .can_admins_bypass == false and .deployment_branch_policy != null' | grep -qx true

      # Mint the one-hour key only after source and destination preflight.
      - name: Exchange GitHub OIDC token for a temporary NuGet key
        id: nuget-login
        if: steps.prepare.outputs.publish-enabled == 'true' && steps.release-preflight.outputs.next-version != ''
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Run semantic-release
        if: steps.prepare.outputs.publish-enabled == 'true' && steps.release-preflight.outputs.next-version != ''
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          HEXALITH_ZOT_REGISTRY: ${{ vars.HEXALITH_ZOT_REGISTRY || 'registry.hexalith.com' }}
          HEXALITH_ZOT_USERNAME: ${{ secrets.HEXALITH_ZOT_USERNAME }}
          HEXALITH_ZOT_API_KEY: ${{ secrets.HEXALITH_ZOT_API_KEY }}

      - name: Detect release publication
        id: release-publication
        if: success() && steps.prepare.outputs.publish-enabled == 'true' && steps.release-preflight.outputs.next-version != ''
        shell: bash
        env:
          BEFORE_FINGERPRINT: ${{ steps.release-tags-before.outputs.fingerprint }}
        run: |
          after_fingerprint="$(git tag --points-at HEAD --list 'v*' | sort | sha256sum | sed 's/ .*//')"
          if [[ "$after_fingerprint" == "$BEFORE_FINGERPRINT" ]]; then
            echo '::error::Release version was computed but semantic-release created no tag.' >&2
            exit 1
          fi

          test -f artifacts/deployment/hexalith-memories-production.yaml
          compgen -G 'artifacts/packages/release/*.nupkg' >/dev/null
          echo 'published=true' >> "$GITHUB_OUTPUT"

      - name: Alert partial release publish
        if: failure()
        shell: pwsh
        run: |
          $summaryPath = "artifacts/release/publish-summary.json"
          if (Test-Path -LiteralPath $summaryPath) {
            ./tools/create-partial-publish-issue.ps1 -SummaryPath $summaryPath
          }
          else {
            Write-Host "No aggregate release summary found; skipping partial-publish issue alert."
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}

      - name: Archive release failure diagnostics
        if: failure()
        run: python3 tools/archive-release-evidence.py --diagnostics --output artifacts/release/hexalith-memories-release-diagnostics.tar.gz

      - name: Upload release publication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-publication-evidence
          path: |
            artifacts/release/**
            artifacts/packages/release/publish-summary.json
            artifacts/containers/release/publish-summary.json
            artifacts/containers/release/build-summary.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload package artifacts
        if: success() && steps.release-publication.outputs.published == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: artifacts/packages/release/*.nupkg
          if-no-files-found: warn

      - name: Upload deployment artifact
        if: success() && steps.release-publication.outputs.published == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: production-deployment
          path: artifacts/deployment/hexalith-memories-production.yaml
          if-no-files-found: error
