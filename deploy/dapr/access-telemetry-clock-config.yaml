# Self-hosted development keeps secret scopes but omits invocation ACLs because authenticated caller identities
# require Sentry/mTLS. Kubernetes applies the workload-specific clock allow-list.
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: memories-access-telemetry-clock-config
spec:
  features:
    - name: HotReload
      enabled: false
  secrets:
    scopes:
      - storeName: access-telemetry-secrets
        defaultAccess: deny
        allowedSecrets:
          - access-telemetry-clock-key
