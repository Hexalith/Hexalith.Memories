apiVersion: v1
kind: ServiceAccount
metadata:
  name: access-telemetry-postgresql
  labels:
    app.kubernetes.io/name: access-telemetry-postgresql
    app.kubernetes.io/component: database
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: access-telemetry-postgresql-config
  labels:
    app.kubernetes.io/name: access-telemetry-postgresql
    app.kubernetes.io/component: database
data:
  pg_hba.conf: |
    local   all   memories_admin     peer map=container-postgres
    local   all   all                peer
    hostssl all   all   0.0.0.0/0    scram-sha-256
    hostssl all   all   ::/0         scram-sha-256
    hostnossl all all   0.0.0.0/0    reject
    hostnossl all all   ::/0         reject
  pg_ident.conf: |
    container-postgres postgres memories_admin
  010-access-telemetry.sh: |
    #!/usr/bin/env bash
    set -Eeuo pipefail

    runtime_password_file=/run/secrets/postgresql/runtime-password
    if [[ ! -s "$runtime_password_file" ]]; then
      echo "FATAL: required bootstrap secret key 'runtime-password' is missing or empty at $runtime_password_file; refusing initdb.d role setup (a partial init would trap the Retain PVC)." >&2
      exit 1
    fi
    runtime_password="$(< "$runtime_password_file")"
    export runtime_password
    psql --set ON_ERROR_STOP=1 --set=runtime_password="$runtime_password" --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<'EOSQL'
    SELECT 'CREATE ROLE memories_access_telemetry_runtime LOGIN'
    WHERE NOT EXISTS (
      SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = 'memories_access_telemetry_runtime'
    ) \gexec
    SELECT format(
      'ALTER ROLE memories_access_telemetry_runtime PASSWORD %L',
      :'runtime_password'
    ) \gexec
    CREATE SCHEMA IF NOT EXISTS access_telemetry AUTHORIZATION memories_access_telemetry_runtime;
    REVOKE ALL ON DATABASE memories_access_telemetry FROM PUBLIC;
    GRANT CONNECT ON DATABASE memories_access_telemetry TO memories_access_telemetry_runtime;
    REVOKE ALL ON SCHEMA public FROM PUBLIC;
    GRANT USAGE, CREATE ON SCHEMA access_telemetry TO memories_access_telemetry_runtime;
    CREATE EXTENSION IF NOT EXISTS pgstattuple;
    EOSQL
    unset runtime_password
---
apiVersion: v1
kind: Service
metadata:
  name: access-telemetry-postgresql
  labels:
    app.kubernetes.io/name: access-telemetry-postgresql
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: access-telemetry-postgresql
  ports:
    - name: postgresql
      protocol: TCP
      port: 5432
      targetPort: postgresql
---
apiVersion: v1
kind: Service
metadata:
  name: access-telemetry-postgresql-headless
  labels:
    app.kubernetes.io/name: access-telemetry-postgresql
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: access-telemetry-postgresql
  ports:
    - name: postgresql
      protocol: TCP
      port: 5432
      targetPort: postgresql
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: access-telemetry-postgresql
  labels:
    app.kubernetes.io/name: access-telemetry-postgresql
    app.kubernetes.io/component: database
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: access-telemetry-postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: access-telemetry-postgresql
  labels:
    app.kubernetes.io/name: access-telemetry-postgresql
    app.kubernetes.io/component: database
    hexalith.io/profile: pg-onprem-1
spec:
  serviceName: access-telemetry-postgresql-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: access-telemetry-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: access-telemetry-postgresql
        app.kubernetes.io/component: database
        hexalith.io/profile: pg-onprem-1
      annotations:
        hexalith.io/profile-id: postgresql-v2-dapr-1.18.1-postgresql-18.4-onprem-k8s1-openebs-local-retain-400g-v1
        hexalith.io/availability: single-node-non-ha
    spec:
      serviceAccountName: access-telemetry-postgresql
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: docker.io/library/postgres:18.4-trixie@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - hba_file=/etc/postgresql/pg_hba.conf
            - -c
            - ident_file=/etc/postgresql/pg_ident.conf
            - -c
            - ssl=on
            - -c
            - ssl_min_protocol_version=TLSv1.2
            - -c
            - ssl_cert_file=/run/postgresql-tls/tls.crt
            - -c
            - ssl_key_file=/run/postgresql-tls/tls.key
            - -c
            - ssl_ca_file=/run/postgresql-tls/ca.crt
            - -c
            - password_encryption=scram-sha-256
            - -c
            - max_connections=100
            - -c
            - shared_buffers=4GB
            - -c
            - effective_cache_size=12GB
            - -c
            - fsync=on
            - -c
            - synchronous_commit=on
            - -c
            - full_page_writes=on
            - -c
            - log_connections=on
            - -c
            - log_disconnections=on
            - -c
            - log_statement=none
          env:
            - name: POSTGRES_USER
              value: memories_admin
            - name: POSTGRES_DB
              value: memories_access_telemetry
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/postgresql/admin-password
            - name: POSTGRES_INITDB_ARGS
              value: --auth-host=scram-sha-256 --auth-local=peer --data-checksums
            - name: PGDATA
              value: /var/lib/postgresql/18/docker
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              cpu: "8"
              memory: 16Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
          startupProbe:
            exec:
              command: ["/bin/sh", "-ec", "pg_isready --quiet --host=/var/run/postgresql --port=5432 --username=memories_admin --dbname=memories_access_telemetry"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", "pg_isready --quiet --host=/var/run/postgresql --port=5432 --username=memories_admin --dbname=memories_access_telemetry"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/bin/sh", "-ec", "pg_isready --quiet --host=/var/run/postgresql --port=5432 --username=memories_admin --dbname=memories_access_telemetry"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: config
              mountPath: /etc/postgresql/pg_hba.conf
              subPath: pg_hba.conf
              readOnly: true
            - name: config
              mountPath: /etc/postgresql/pg_ident.conf
              subPath: pg_ident.conf
              readOnly: true
            - name: config
              mountPath: /docker-entrypoint-initdb.d/010-access-telemetry.sh
              subPath: 010-access-telemetry.sh
              readOnly: true
            - name: bootstrap
              mountPath: /run/secrets/postgresql
              readOnly: true
            - name: tls
              mountPath: /run/postgresql-tls
              readOnly: true
            - name: runtime
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: access-telemetry-postgresql-config
            defaultMode: 0555
        - name: bootstrap
          secret:
            secretName: access-telemetry-postgresql-bootstrap
            defaultMode: 0440
        - name: tls
          secret:
            secretName: access-telemetry-postgresql-tls
            defaultMode: 0440
        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: access-telemetry-postgresql
          app.kubernetes.io/component: database
          hexalith.io/profile: pg-onprem-1
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: openebs-hostpath-retain
        resources:
          requests:
            storage: 400Gi
