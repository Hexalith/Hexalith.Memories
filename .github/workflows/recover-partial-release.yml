name: Recover Partial Release
run-name: Complete partial release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing partial-release version without the leading v
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  RECOVERY_VERSION: ${{ inputs.version }}

jobs:
  recover-partial-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout recovery workflow source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - name: Resolve trusted release source
        id: release-source
        shell: bash
        run: |
          if [[ ! "$RECOVERY_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Recovery version must be an image-taggable semantic version without a leading v."
            exit 1
          fi

          tag_ref="refs/tags/v$RECOVERY_VERSION"
          git show-ref --verify --quiet "$tag_ref" || {
            echo "::error::Trusted release tag $tag_ref does not exist."
            exit 1
          }

          tag_commit="$(git rev-list -n 1 "$tag_ref")"
          git merge-base --is-ancestor "$tag_commit" origin/main || {
            echo "::error::Release tag $tag_ref is not reachable from origin/main."
            exit 1
          }

          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"

      - name: Validate trusted recovery tooling
        run: python3 -m unittest discover -s tests/tooling/publish_containers -p "*_test.py"

      - name: Stage trusted recovery tooling
        id: recovery-tooling
        shell: pwsh
        run: |
          $toolingPath = Join-Path $env:RUNNER_TEMP 'memories-recovery-tooling'
          New-Item -ItemType Directory -Path $toolingPath -Force | Out-Null
          Copy-Item ./tools/verify-container-registry.ps1 $toolingPath
          Copy-Item ./tools/publish-containers.ps1 $toolingPath
          Copy-Item ./tools/complete-partial-release.ps1 $toolingPath
          "path=$toolingPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout tagged release source
        env:
          RECOVERY_COMMIT: ${{ steps.release-source.outputs.commit }}
        run: git checkout --detach "$RECOVERY_COMMIT"

      - name: Initialize build submodules
        uses: Hexalith/Hexalith.Builds/Github/initialize-build@main

      - name: Initialize .NET
        uses: Hexalith/Hexalith.Builds/Github/initialize-dotnet@main
        with:
          global-json-file: global.json

      - name: Verify container registry write scope
        shell: pwsh
        run: '& "${{ steps.recovery-tooling.outputs.path }}/verify-container-registry.ps1"'
        env:
          HEXALITH_ZOT_REGISTRY: ${{ vars.HEXALITH_ZOT_REGISTRY || 'registry.hexalith.com' }}
          HEXALITH_ZOT_USERNAME: ${{ secrets.HEXALITH_ZOT_USERNAME }}
          HEXALITH_ZOT_API_KEY: ${{ secrets.HEXALITH_ZOT_API_KEY }}

      - name: Restore tagged source
        # Directory.Build.props keeps NU1901-1904 non-fatal (Hexalith ci-cd-standards.md,
        # "Dependency Auditing"), but that only reaches this repo's own projects. Repeat it here
        # via -p: so the same restore graph's Hexalith.FrontComposer submodule project (a separate
        # Directory.Build.props chain) isn't fatally blocked by the AngleSharp/bunit NU1902 chain.
        run: dotnet restore Hexalith.Memories.slnx -p:Configuration=Release -p:WarningsNotAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904

      - name: Build tagged container archives
        shell: pwsh
        run: |
          & "${{ steps.recovery-tooling.outputs.path }}/publish-containers.ps1" `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -Version $env:RECOVERY_VERSION

      - name: Reconcile immutable container tags
        shell: pwsh
        run: |
          & "${{ steps.recovery-tooling.outputs.path }}/publish-containers.ps1" `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -Version $env:RECOVERY_VERSION `
            -Push
        env:
          HEXALITH_ZOT_REGISTRY: ${{ vars.HEXALITH_ZOT_REGISTRY || 'registry.hexalith.com' }}
          HEXALITH_ZOT_USERNAME: ${{ secrets.HEXALITH_ZOT_USERNAME }}
          HEXALITH_ZOT_API_KEY: ${{ secrets.HEXALITH_ZOT_API_KEY }}

      - name: Validate recovery evidence
        shell: pwsh
        run: |
          $summaryPath = 'artifacts/containers/release/publish-summary.json'
          $deploymentPath = 'artifacts/containers/release/production-deployment.yaml'
          if (-not (Test-Path -LiteralPath $summaryPath)) {
            throw "Container recovery summary was not created."
          }
          if (-not (Test-Path -LiteralPath $deploymentPath)) {
            throw "Versioned production deployment was not created."
          }

          $summary = Get-Content -LiteralPath $summaryPath -Raw | ConvertFrom-Json
          if ($summary.status -ne 'succeeded' -or $summary.version -ne $env:RECOVERY_VERSION) {
            throw "Container recovery summary did not report success for $env:RECOVERY_VERSION."
          }

          $images = @($summary.images)
          if ($images.Count -ne 4) {
            throw "Container recovery must reconcile exactly four immutable image tags."
          }
          foreach ($image in $images) {
            if ($image.status -ne 'succeeded' -or $image.disposition -notin @('pushed', 'already-present')) {
              throw "Container recovery evidence contains an unverified image outcome."
            }
          }

      - name: Complete GitHub Release and incident recovery
        shell: pwsh
        run: |
          & "${{ steps.recovery-tooling.outputs.path }}/complete-partial-release.ps1" `
            -Version $env:RECOVERY_VERSION `
            -SourceRoot $env:GITHUB_WORKSPACE `
            -ContainerSummaryPath ./artifacts/containers/release/publish-summary.json `
            -DeploymentPath ./artifacts/containers/release/production-deployment.yaml `
            -OutputDirectory "./artifacts/recovery/v$env:RECOVERY_VERSION" `
            -Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEXALITH_ZOT_REGISTRY: ${{ vars.HEXALITH_ZOT_REGISTRY || 'registry.hexalith.com' }}

      - name: Validate release completion evidence
        shell: pwsh
        run: |
          $summaryPath = "./artifacts/recovery/v$env:RECOVERY_VERSION/completion-summary.json"
          if (-not (Test-Path -LiteralPath $summaryPath)) {
            throw "Partial-release completion summary was not created."
          }
          $summary = Get-Content -LiteralPath $summaryPath -Raw | ConvertFrom-Json
          if ($summary.status -ne 'succeeded' -or $summary.version -ne $env:RECOVERY_VERSION) {
            throw "Partial-release completion evidence did not report success."
          }
          if (@($summary.packages).Count -ne 9 -or @($summary.images).Count -ne 4 -or @($summary.releaseAssets).Count -ne 10) {
            throw "Partial-release completion evidence does not contain the complete release unit."
          }

      - name: Upload container recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: partial-release-completion-v${{ inputs.version }}
          path: |
            artifacts/containers/release/build-summary.json
            artifacts/containers/release/publish-summary.json
            artifacts/containers/release/production-deployment.yaml
            artifacts/recovery/v${{ inputs.version }}/completion-summary.json
          if-no-files-found: warn
          retention-days: 14
