name: Qualify Builds publication

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/qualify-builds-publication.yml
      - references/Hexalith.Builds
      - tools/builds-publication-qualification.json
      - tools/qualify-builds-publication.py
      - tools/release-packages.json
      - src/**/*.csproj
  push:
    branches: [main]
    paths:
      - .github/workflows/qualify-builds-publication.yml
      - references/Hexalith.Builds
      - tools/builds-publication-qualification.json
      - tools/qualify-builds-publication.py
      - tools/release-packages.json
      - src/**/*.csproj

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Checkout only the root Builds dependency
        run: git -c submodule.recurse=false submodule update --init --checkout -- references/Hexalith.Builds

      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Qualify the exact source and publisher helpers
        shell: bash
        run: |
          set -euo pipefail
          qualification_directory="$RUNNER_TEMP/builds-publication-qualification"
          mkdir -p "$qualification_directory"
          git status --porcelain > "$qualification_directory/source-status.txt"
          test ! -s "$qualification_directory/source-status.txt"
          dotnet --version | tee "$qualification_directory/dotnet-version.txt"
          pwsh -NoProfile -File references/Hexalith.Builds/Tools/test-publish-containers.ps1 2>&1 | tee "$qualification_directory/upstream-fixtures.log"
          python3 tools/qualify-builds-publication.py --output-directory "$qualification_directory/results" 2>&1 | tee "$qualification_directory/qualification.log"

      - name: Upload exact qualification results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: builds-publication-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/builds-publication-qualification/
          if-no-files-found: error
          retention-days: 30
