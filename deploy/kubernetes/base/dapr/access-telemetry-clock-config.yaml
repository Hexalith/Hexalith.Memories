apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: memories-access-telemetry-clock-config
spec:
  secrets:
    scopes:
      - storeName: access-telemetry-secrets
        defaultAccess: deny
        allowedSecrets:
          - access-telemetry-clock-key
  accessControl:
    defaultAction: deny
    trustDomain: public
    policies:
      - appId: memories
        namespace: hexalith-memories
        trustDomain: public
        defaultAction: deny
        operations:
          - name: /v1/time/attest
            httpVerb: ["POST"]
            action: allow
      - appId: memories-access-telemetry
        namespace: hexalith-memories
        trustDomain: public
        defaultAction: deny
        operations:
          - name: /v1/time/attest
            httpVerb: ["POST"]
            action: allow
