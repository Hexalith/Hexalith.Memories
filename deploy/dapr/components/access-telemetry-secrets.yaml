# Development/test-only secret component. AppHost emits a temporary copy with an absolute secretsFile.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: access-telemetry-secrets
spec:
  type: secretstores.local.file
  version: v1
  metadata:
    - name: secretsFile
      value: "./secrets.json"
    - name: nestedSeparator
      value: ":"
scopes:
  - memories
  - memories-access-telemetry
  - memories-access-telemetry-clock
