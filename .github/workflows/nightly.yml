name: Nightly Integration Tests

"on":
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

env:
  DAPR_CLI_VERSION: '1.17.1'
  DAPR_RUNTIME_VERSION: '1.17.6'

jobs:
  integration-fast:
    name: Tier 3 integration (fast lane)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Dapr CLI
        uses: dapr/setup-dapr@v1
        with:
          version: ${{ env.DAPR_CLI_VERSION }}

      - name: Initialize Dapr runtime
        run: |
          dapr init --slim --runtime-version ${{ env.DAPR_RUNTIME_VERSION }}
          dapr --version

      - name: Restore solution
        run: dotnet restore Hexalith.Memories.slnx

      - name: Run Tier 3 integration tests (fast lane, excludes IntegrationSlow and Performance)
        run: bash ./tools/test.sh --filter "Category=Integration&Category!=IntegrationSlow&Category!=Performance"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-integration-fast-artifacts
          path: |
            **/TestResults/**
            artifacts/**
          if-no-files-found: ignore

  integration-slow:
    name: Tier 3 integration (slow lane)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Dapr CLI
        uses: dapr/setup-dapr@v1
        with:
          version: ${{ env.DAPR_CLI_VERSION }}

      - name: Initialize Dapr runtime
        run: |
          dapr init --slim --runtime-version ${{ env.DAPR_RUNTIME_VERSION }}
          dapr --version

      - name: Restore solution
        run: dotnet restore Hexalith.Memories.slnx

      - name: Run Tier 3 integration tests (slow lane only)
        run: bash ./tools/test.sh --filter "Category=IntegrationSlow"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-integration-slow-artifacts
          path: |
            **/TestResults/**
            artifacts/**
          if-no-files-found: ignore
