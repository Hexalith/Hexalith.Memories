name: Release

on:
  push:
    branches: [main]

# cancel-in-progress: false is deliberate. A release run that is interrupted mid-publish
# would leave NuGet in a partial-publish state; the rerun-and-self-heal recovery model
# (see docs/dev/release-runbook.md and tools/publish-nuget.ps1 with --skip-duplicate)
# requires that an in-flight release runs to completion rather than being cancelled by
# the next push to main.
concurrency:
  group: release
  cancel-in-progress: false

# Least-privilege scopes for the release job:
# - contents: write — semantic-release creates the release tag and GitHub Release.
# - issues: write — Alert partial NuGet publish step opens / comments on the
#   PARTIAL PUBLISH reconciliation issue.
# - pull-requests: write — @semantic-release/github comments on the PR that triggered
#   the release. No additional write scopes are added without a documented justification.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Third-party actions are SHA-pinned per GitHub's supply-chain hardening guidance
      # (https://docs.github.com/actions/learn-github-actions/security-hardening-for-github-actions).
      # The release workflow has NUGET_API_KEY access, so the supply-chain blast radius
      # for an unexpected major-tag retag would publish under our identity. Re-pin when
      # bumping versions; the trailing comment names the human-readable tag for review
      # context, but the SHA is the authoritative reference.
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: npm

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Hexalith.Memories.slnx

      - name: Build
        run: dotnet build Hexalith.Memories.slnx --configuration Release --no-restore

      - name: Test unit and non-Docker suite
        shell: pwsh
        run: ./tools/test-release.ps1

      - name: Install release tooling
        run: npm ci

      - name: Validate package inventory before release
        shell: pwsh
        run: ./tools/validate-release-packages.ps1

      - name: Run release package validator fixtures
        run: python3 -m unittest discover -s tests/tooling/release_packages -p "*_test.py"

      - name: Run release preflight
        shell: pwsh
        run: ./tools/release-preflight.ps1
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Alert partial NuGet publish
        if: failure()
        shell: pwsh
        run: |
          $summaryPath = "artifacts/packages/release/publish-summary.json"
          if (Test-Path -LiteralPath $summaryPath) {
            ./tools/create-partial-publish-issue.ps1 -SummaryPath $summaryPath
          }
          else {
            Write-Host "No NuGet publish summary found; skipping partial-publish issue alert."
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}

      - name: Upload package artifacts
        if: success()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-packages
          path: artifacts/packages/release/*.nupkg
          if-no-files-found: warn
