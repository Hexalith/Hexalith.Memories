apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - service-accounts-rbac.yaml
  - services.yaml
  - server-deployment.yaml
  - mcp-deployment.yaml
  - access-telemetry-deployments.yaml
  - access-telemetry-network-policy.yaml
  - redis-statefulset.yaml
  - falkordb-statefulset.yaml
  - dapr/config.yaml
  - dapr/mcp-config.yaml
  - dapr/secretstore.yaml
  - dapr/statestore.yaml
  - dapr/pubsub.yaml
  - dapr/conversation-openai.yaml
  - dapr/access-telemetry-store.yaml
  - dapr/access-telemetry-secrets.yaml
  - dapr/access-telemetry-config-store.yaml
  - dapr/access-telemetry-lifecycle-config.yaml
  - dapr/access-telemetry-clock-config.yaml
configMapGenerator:
  - name: memories-production-config
    literals:
      - OIDC_AUTHORITY=https://identity.example.com
      - OIDC_ISSUER=https://identity.example.com
      - OIDC_AUDIENCE=hexalith-memories
      - OIDC_TENANT_CLAIM=tenant_id
      # Story 27.2 portable templates remain disabled until Story 27.3 supplies exact eligible evidence.
      - ACCESS_TELEMETRY_ENABLED=false
      - ACCESS_TELEMETRY_COMPONENT_PROFILE_HASH=unproven
  - name: redis-stack-config
    files:
      - redis-stack.conf=config/redis-stack.conf
  - name: falkordb-config
    literals:
      - FALKORDB_PERSISTENCE_ARGS=--appendonly yes --appendfsync everysec --dir /var/lib/falkordb/data
generatorOptions:
  disableNameSuffixHash: false
