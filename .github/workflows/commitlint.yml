name: Commitlint
on:
  pull_request:
    branches: [main]
    # `edited` retriggers the gate when the PR title changes, because the title can become the
    # squash-commit subject that semantic-release reads.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
concurrency:
  # Each main push owns an event-specific range. Separate groups also prevent
  # a later push from replacing a queued run before that range is validated.
  group: commitlint-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  commitlint:
    uses: Hexalith/Hexalith.Builds/.github/workflows/commitlint.yml@main
    with:
      pull-request-title: ${{ github.event.pull_request.title }}
