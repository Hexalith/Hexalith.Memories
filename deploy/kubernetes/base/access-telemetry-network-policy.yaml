apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: memories-access-telemetry
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: memories-access-telemetry
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: memories
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: memories-access-telemetry-inspector
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: access-telemetry-adapter
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: access-telemetry-postgresql
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis-stack
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: memories-access-telemetry-clock
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dapr-system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openbao
      ports:
        - protocol: TCP
          port: 8200
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - ipBlock:
            cidr: 169.254.25.10/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: access-telemetry-postgresql
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: access-telemetry-postgresql
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: memories-access-telemetry
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: access-telemetry-postgresql-verifier
      ports:
        - protocol: TCP
          port: 5432
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: memories-access-telemetry-clock
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: memories-access-telemetry-clock
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: memories
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: memories-access-telemetry
  egress:
    - ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dapr-system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openbao
      ports:
        - protocol: TCP
          port: 8200
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - ipBlock:
            cidr: 169.254.25.10/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
