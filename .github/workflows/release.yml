name: Release

on:
  push:
    branches: [main]

# cancel-in-progress: false is deliberate. A release run that is interrupted mid-publish
# would leave NuGet in a partial-publish state; the rerun-and-self-heal recovery model
# (see docs/dev/release-runbook.md and tools/publish-nuget.ps1 with --skip-duplicate)
# requires that an in-flight release runs to completion rather than being cancelled by
# the next push to main.
concurrency:
  group: release
  cancel-in-progress: false

env:
  KUBECTL_VERSION: 'v1.35.0'

# Least-privilege scopes for the release job:
# - contents: write - semantic-release creates the release tag and GitHub Release.
# - issues: write - Alert partial release publish step opens / comments on the
#   PARTIAL PUBLISH reconciliation issue.
# - pull-requests: write - @semantic-release/github comments on the PR that triggered
#   the release. No additional write scopes are added without a documented justification.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - name: Initialize build submodules
        uses: Hexalith/Hexalith.Builds/Github/initialize-build@main

      - name: Initialize .NET
        uses: Hexalith/Hexalith.Builds/Github/initialize-dotnet@main
        with:
          global-json-file: global.json

      - name: Initialize kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Hexalith.Memories.slnx -p:Configuration=Release

      - name: Build
        run: dotnet build Hexalith.Memories.slnx --configuration Release --no-restore

      - name: Test unit and non-Docker suite
        shell: pwsh
        run: ./tools/test-release.ps1

      - name: Install release tooling
        run: npm ci

      - name: Validate package inventory before release
        shell: pwsh
        run: ./tools/validate-release-packages.ps1

      - name: Run release package validator fixtures
        run: python3 -m unittest discover -s tests/tooling/release_packages -p "*_test.py"

      - name: Run container publish fixtures
        run: python3 -m unittest discover -s tests/tooling/publish_containers -p "*_test.py"

      - name: Run release preflight fixtures
        run: python3 -m unittest discover -s tests/tooling/release_preflight -p "*_test.py"

      - name: Run release preflight
        shell: pwsh
        run: ./tools/release-preflight.ps1
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Snapshot release tags
        id: release-tags-before
        shell: bash
        run: git tag --points-at HEAD --list 'v*' | sort | sha256sum | sed 's/ .*//' | xargs -I{} echo 'fingerprint={}' >> "$GITHUB_OUTPUT"

      - name: Run semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          HEXALITH_ZOT_REGISTRY: ${{ vars.HEXALITH_ZOT_REGISTRY || 'registry.hexalith.com' }}
          HEXALITH_ZOT_USERNAME: ${{ secrets.HEXALITH_ZOT_USERNAME }}
          HEXALITH_ZOT_API_KEY: ${{ secrets.HEXALITH_ZOT_API_KEY }}

      - name: Detect release publication
        id: release-publication
        if: success()
        shell: bash
        env:
          BEFORE_FINGERPRINT: ${{ steps.release-tags-before.outputs.fingerprint }}
        run: |
          after_fingerprint="$(git tag --points-at HEAD --list 'v*' | sort | sha256sum | sed 's/ .*//')"
          if [[ "$after_fingerprint" == "$BEFORE_FINGERPRINT" ]]; then
            echo 'published=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test -f artifacts/deployment/hexalith-memories-production.yaml
          compgen -G 'artifacts/packages/release/*.nupkg' >/dev/null
          echo 'published=true' >> "$GITHUB_OUTPUT"

      - name: Alert partial release publish
        if: failure()
        shell: pwsh
        run: |
          $summaryPath = "artifacts/release/publish-summary.json"
          if (Test-Path -LiteralPath $summaryPath) {
            ./tools/create-partial-publish-issue.ps1 -SummaryPath $summaryPath
          }
          else {
            Write-Host "No aggregate release summary found; skipping partial-publish issue alert."
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}

      - name: Upload release publication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-publication-evidence
          path: |
            artifacts/release/publish-summary.json
            artifacts/packages/release/publish-summary.json
            artifacts/containers/release/publish-summary.json
            artifacts/containers/release/build-summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload package artifacts
        if: success() && steps.release-publication.outputs.published == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: artifacts/packages/release/*.nupkg
          if-no-files-found: warn

      - name: Upload deployment artifact
        if: success() && steps.release-publication.outputs.published == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: production-deployment
          path: artifacts/deployment/hexalith-memories-production.yaml
          if-no-files-found: error
