  13-3-extend-embedding-client-to-support-ollama: backlog # Extends EmbeddingClient: dispatches to Ollama-native POST {BaseUrl}/api/embed with Bearer JWT injection from IOidcTokenProvider; preserves Google flow unchanged; dimension-mismatch throws; 401-invalidate-and-retry. Depends on 13.1 + 13.2.
  13-4-extend-tenant-embedding-config-with-additive-oidc-fields: backlog # Adds non-breaking BaseUrl, AuthMode, OidcTokenEndpoint, OidcClientId, OidcScope to TenantEmbeddingConfig. Wire-compat: existing serialized state deserializes with new fields defaulted. Tightens Validate() with conditional-required logic. Depends on 13.1.
  13-5-surface-new-fields-via-tenant-configuration-actor: backlog # Plumbs the new fields through TenantConfigurationActor (read + write + state migration). Listing surface masks client_secret value but exposes secret-name reference. Depends on 13.4.
  13-6-vector-migration-tool: backlog # CLI/console tool to drop {tenantId}:semantic indexes and replay ingestion at the new dimension count. Dry-run + live + interrupt-resume + rollback (Path B opt-in only). Depends on 13.1..13.5.
  13-7-integration-tests-aspire-fixtures-and-operator-deployment-guide: backlog # Parameterizes embedding integration suite over {google, ollama}; new OllamaEmbeddingEndToEnd integration test; ships docs/operations/embedding-providers.md with gateway contract, Envoy+Ollama anonymized example, per-provider config table, Keycloak setup, DAPR Secrets layout. Depends on 13.6 (full path proven before docs ship).
