apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: memories-config
spec:
  # Dapr 1.18 enables HotReload by default, but actor state stores cannot be reloaded in place.
  # Keep component changes deterministic: apply the manifest, then restart the owning workload.
  features:
    - name: HotReload
      enabled: false
  secrets:
    scopes:
      - storeName: secretstore
        defaultAccess: deny
        allowedSecrets:
          - redis-secret
          - google-embedding-api-key
          - memories-embedding-client-secret
          - llm-secret
      - storeName: access-telemetry-secrets
        defaultAccess: deny
        allowedSecrets:
          - access-telemetry-marker-key
  accessControl:
    defaultAction: deny
    trustDomain: public
    policies:
      - appId: memories-mcp
        namespace: hexalith-memories
        trustDomain: public
        defaultAction: deny
        operations:
          - name: /api/v1/**
            httpVerb: ["GET", "POST"]
            action: allow
