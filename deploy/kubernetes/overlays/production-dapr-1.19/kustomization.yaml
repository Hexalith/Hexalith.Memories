apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../production
patches:
  - target:
      group: dapr.io
      version: v1alpha1
      kind: Configuration
      name: memories(-mcp|-access-telemetry|-access-telemetry-clock)?-config
    patch: |-
      - op: add
        path: /spec/secrets/scopes/-
        value:
          storeName: kubernetes
          defaultAccess: deny
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: memories(-mcp|-access-telemetry|-access-telemetry-clock)?
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations/dapr.io~1sidecar-image
        value: ghcr.io/dapr/daprd:1.19.2@sha256:7839fbb66d4be24ec52e347bec2dca66a91bef3079d8c8d57676f6d3ef92654f
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: Role
      name: memories-dapr-secret-reader
    patch: |-
      - op: replace
        path: /rules/0/resourceNames
        value: [app-api-token, dapr-api-token, redis-secret, openbao-runtime-bootstrap]
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: Role
      name: memories-access-telemetry-secret-reader
    patch: |-
      - op: replace
        path: /rules/0/resourceNames
        value: [redis-secret, app-api-token, dapr-api-token, openbao-access-telemetry-bootstrap]
