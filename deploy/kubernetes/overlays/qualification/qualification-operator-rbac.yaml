apiVersion: v1
kind: ServiceAccount
metadata:
  name: access-telemetry-qualification-operator
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: access-telemetry-qualification-operator
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - access-telemetry-qualification-gate
      - access-telemetry-physical-evidence-report
    verbs: ["get", "patch", "update"]
  # Pod names are generated by workload controllers, so resourceNames cannot
  # safely scope these read/subresource operations.  Namespace scope and the
  # exact verbs are the narrow enforceable boundary.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      - memories
      - memories-access-telemetry
      - memories-access-telemetry-clock
    verbs: ["patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames:
      - memories-access-telemetry
      - memories-access-telemetry-clock
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: ["access-telemetry-postgresql"]
    verbs: ["patch", "update"]
  - apiGroups: ["apps"]
    resources: ["statefulsets/scale"]
    resourceNames: ["access-telemetry-postgresql"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    resourceNames: ["access-telemetry-physical-evidence-reporter"]
    verbs: ["get", "watch", "patch", "update"]
  - apiGroups: ["dapr.io"]
    resources: ["components", "configurations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["access-telemetry-qualification"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: access-telemetry-qualification-operator
subjects:
  - kind: Group
    name: hexalith-platform-operations
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: access-telemetry-qualification-operator
---
# Dapr control-plane replacement drills cross a namespace boundary.  Keep the
# exception in a second namespaced Role instead of granting a ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: access-telemetry-qualification-dapr-control-plane
  namespace: dapr-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames:
      - dapr-placement-server
      - dapr-scheduler-server
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["statefulsets/scale"]
    resourceNames:
      - dapr-placement-server
      - dapr-scheduler-server
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: access-telemetry-qualification-dapr-control-plane
  namespace: dapr-system
subjects:
  - kind: Group
    name: hexalith-platform-operations
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: access-telemetry-qualification-dapr-control-plane
