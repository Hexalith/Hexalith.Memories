apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hexalith-memories
resources:
  - namespace.yaml
  - ../../base
patches:
  - path: access-telemetry-disabled-patch.yaml
  # While the lifecycle is disabled (DW-730), the Server app-id `memories` loads neither lifecycle
  # component and cannot read the lifecycle OpenBao bootstrap secret. Each removal first tests the
  # exact base entry, so a reordered base fails the render instead of removing the wrong entry.
  - target:
      group: dapr.io
      version: v1alpha1
      kind: Component
      name: access-telemetry-secrets
    patch: |-
      - op: test
        path: /scopes/0
        value: memories
      - op: remove
        path: /scopes/0
  - target:
      group: dapr.io
      version: v1alpha1
      kind: Component
      name: access-telemetry-config
    patch: |-
      - op: test
        path: /scopes/0
        value: memories
      - op: remove
        path: /scopes/0
  - target:
      group: dapr.io
      version: v1alpha1
      kind: Configuration
      name: memories(-mcp|-access-telemetry|-access-telemetry-clock)?-config
    patch: |-
      - op: add
        path: /spec/secrets/scopes/-
        value:
          storeName: kubernetes
          defaultAccess: deny
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: memories(-mcp|-access-telemetry|-access-telemetry-clock)?
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations/dapr.io~1sidecar-image
        value: ghcr.io/dapr/daprd:1.19.2@sha256:7839fbb66d4be24ec52e347bec2dca66a91bef3079d8c8d57676f6d3ef92654f
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: Role
      name: memories-dapr-secret-reader
    patch: |-
      - op: test
        path: /rules/0/resourceNames/8
        value: openbao-access-telemetry-bootstrap
      - op: remove
        path: /rules/0/resourceNames/8
      - op: test
        path: /rules/0/resourceNames/6
        value: access-telemetry-marker-key
      - op: remove
        path: /rules/0/resourceNames/6
      - op: test
        path: /rules/0/resourceNames/5
        value: memories-embedding-client-secret
      - op: remove
        path: /rules/0/resourceNames/5
      - op: test
        path: /rules/0/resourceNames/4
        value: google-embedding-api-key
      - op: remove
        path: /rules/0/resourceNames/4
      - op: test
        path: /rules/0/resourceNames/3
        value: llm-secret
      - op: remove
        path: /rules/0/resourceNames/3
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: Role
      name: memories-access-telemetry-secret-reader
    patch: |-
      - op: test
        path: /rules/0/resourceNames/0
        value: access-telemetry-marker-key
      - op: remove
        path: /rules/0/resourceNames/0
configMapGenerator:
  - name: memories-production-config
    behavior: merge
    literals:
      - ACCESS_TELEMETRY_ENABLED=false
      - ACCESS_TELEMETRY_COMPONENT_PROFILE_HASH=unproven
images:
  - name: registry.hexalith.com/memories
    newName: registry.hexalith.com/memories
    newTag: 0.0.0
  - name: registry.hexalith.com/memories-mcp
    newName: registry.hexalith.com/memories-mcp
    newTag: 0.0.0
  - name: registry.hexalith.com/memories-access-telemetry
    newName: registry.hexalith.com/memories-access-telemetry
    newTag: 0.0.0
  - name: registry.hexalith.com/memories-access-telemetry-clock
    newName: registry.hexalith.com/memories-access-telemetry-clock
    newTag: 0.0.0
