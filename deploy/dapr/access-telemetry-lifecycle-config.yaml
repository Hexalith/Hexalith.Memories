# Self-hosted development keeps secret scopes but omits invocation ACLs because authenticated caller identities
# require Sentry/mTLS. Kubernetes applies the workload-specific lifecycle allow-list.
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: memories-access-telemetry-config
spec:
  secrets:
    scopes:
      - storeName: access-telemetry-secrets
        defaultAccess: deny
        allowedSecrets:
          - access-telemetry-marker-key
