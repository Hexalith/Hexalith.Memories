# Canonical production Conversation component. Local Aspire development generates its own
# conversation.echo component in a temporary directory; that development component is never deployed.
# Keep responseCacheTTL at zero because the DAPR Conversation cache is shared across tenants.
# https://docs.dapr.io/reference/components-reference/supported-conversation/openai/
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: llm-openai
spec:
  type: conversation.openai
  version: v1
  metadata:
    - name: key
      secretKeyRef:
        name: llm-secret
        key: OPENAI_API_KEY
    - name: model
      value: "gpt-4o-mini"
    - name: responseCacheTTL
      value: "0s"
auth:
  secretStore: secretstore
scopes:
  - memories
