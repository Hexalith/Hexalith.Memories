name: CI

"on":
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

permissions:
  contents: read

env:
  DAPR_CLI_VERSION: '1.17.1'
  DAPR_RUNTIME_VERSION: '1.17.6'
  MEMORIES_DAPR_PLACEMENT_HOST_ADDRESS: '127.0.0.1:50005'
  MEMORIES_DAPR_SCHEDULER_HOST_ADDRESS: '127.0.0.1:50006'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  story-file-scope:
    name: story-file-scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Collect story scope inputs
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          mkdir -p .story-scope

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            branch_name="$PR_HEAD_REF"
            head_sha="$PR_HEAD_SHA"
            git diff --name-only "$PR_BASE_SHA" "$head_sha" -- > .story-scope/changed-files.txt
          else
            branch_name="${GITHUB_REF_NAME}"
            head_sha="${GITHUB_SHA}"
            # Force-push and brand-new-branch first push: github.event.before is
            # all-zeros or unreachable. Fall back to comparing against `main` so
            # the changed-file list reflects the branch contents, not the merge
            # diff or every file in HEAD.
            if [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]] || ! git rev-parse --verify --quiet "$PUSH_BEFORE_SHA^{commit}" >/dev/null; then
              git fetch --no-tags --depth=1 origin main >/dev/null 2>&1 || true
              if git rev-parse --verify --quiet origin/main >/dev/null; then
                git diff --name-only origin/main..."$head_sha" -- > .story-scope/changed-files.txt
              else
                git diff-tree --no-commit-id --name-only -r "$head_sha" > .story-scope/changed-files.txt
              fi
            else
              git diff --name-only "$PUSH_BEFORE_SHA" "$head_sha" -- > .story-scope/changed-files.txt
            fi
          fi

          git log -1 --format=%B "$head_sha" > .story-scope/commit-message.txt
          {
            printf 'BRANCH_NAME<<__STORY_SCOPE_EOF__\n%s\n__STORY_SCOPE_EOF__\n' "$branch_name"
            echo "COMMIT_MESSAGE_FILE=.story-scope/commit-message.txt"
            echo "CHANGED_FILES_FILE=.story-scope/changed-files.txt"
          } >> "$GITHUB_ENV"

      - name: Validate story file scope
        run: python3 tools/check-story-file-scope.py --branch-name "$BRANCH_NAME" --commit-message-file "$COMMIT_MESSAGE_FILE" --changed-files-file "$CHANGED_FILES_FILE"

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore solution
        run: dotnet restore Hexalith.Memories.slnx

      - name: Build solution
        run: dotnet build Hexalith.Memories.slnx --configuration Release --no-restore

  test-unit-contract:
    name: test-unit-contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore solution
        run: dotnet restore Hexalith.Memories.slnx

      - name: Build solution
        run: dotnet build Hexalith.Memories.slnx --configuration Release --no-restore

      - name: Run Docker-free unit and contract tests
        run: bash ./tools/test.sh --filter "Category!=Integration" --configuration Release --no-build --results-directory TestResults/test-unit-contract

      - name: Upload unit and contract test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-unit-contract-results
          path: TestResults/test-unit-contract/**
          if-no-files-found: error
          retention-days: 14

  integration-fast:
    name: integration-fast
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install Dapr CLI
        uses: dapr/setup-dapr@v1
        with:
          version: ${{ env.DAPR_CLI_VERSION }}

      - name: Initialize Dapr runtime
        run: |
          dapr init --slim --runtime-version ${{ env.DAPR_RUNTIME_VERSION }}
          docker run -d --name dapr_placement -p 50005:50005 daprio/dapr:${{ env.DAPR_RUNTIME_VERSION }} ./placement
          docker volume create dapr_scheduler
          docker run -d --name dapr_scheduler -p 50006:50006 -p 2379:2379 -v dapr_scheduler:/var/lock daprio/dapr:${{ env.DAPR_RUNTIME_VERSION }} ./scheduler --etcd-data-dir=/var/lock/dapr/scheduler --override-broadcast-host-port=127.0.0.1:50006 --etcd-client-listen-address=0.0.0.0
          dapr --version

      - name: Verify Docker availability
        run: |
          docker version
          docker info

      - name: Restore solution
        run: dotnet restore Hexalith.Memories.slnx

      - name: Build solution
        run: dotnet build Hexalith.Memories.slnx --configuration Release --no-restore

      - name: Run fast Docker-backed integration tests
        run: bash ./tools/test.sh --filter "Category=Integration&Category!=IntegrationSlow&Category!=Performance" --configuration Release --no-build --results-directory TestResults/integration-fast

      - name: Verify fast integration coverage evidence
        run: python3 tools/verify-integration-fast-coverage.py --results-directory TestResults/integration-fast

      - name: Upload fast integration test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: integration-fast-results
          path: TestResults/integration-fast/**
          if-no-files-found: error
          retention-days: 14
